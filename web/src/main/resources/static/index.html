<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locker Admin - Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
<div class="sidebar">
    <h2>Locker Admin</h2>
    <a href="index.html" class="active">🏠 Dashboard</a>
    <a href="lockers.html">📦 Quản lý Tủ đồ</a>
    <a href="users.html">🕒 Phiên sử dụng</a>
    <a href="support.html">📩 Quản lý Ticket</a>
</div>

<div class="main">
    <header>
        <h1>Tổng quan hệ thống</h1>
    </header>
    <div class="cards">
        <div class="card blue">
            <h3>Tổng số tủ</h3>
            <p id="total">0</p>
        </div>
        <div class="card green">
            <h3>Tủ đang trống</h3>
            <p id="available">0</p>
        </div>
        <div class="card orange">
            <h3>Đang sử dụng</h3>
            <p id="occupied">0</p>
        </div>
        <div class="card red">
            <h3>Tủ báo lỗi</h3>
            <p id="error">0</p>
        </div>
        <div class="card purple">
            <h3>Ticket đã xử lý</h3>
            <p id="supportCount">0</p>
        </div>
    </div>

    <div class="trend-section"
         style="background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-top: 20px; margin-bottom: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h3 style="margin: 0;">Biểu đồ Xu hướng Hoạt động</h3>

            <div style="display: flex; gap: 10px; align-items: center;">
                <select id="timeFilter" style="padding: 5px; border-radius: 5px; border: 1px solid #ccc;">
                    <option value="week">7 ngày qua</option>
                    <option value="month">Tháng này</option>
                    <option value="year">Năm nay</option>
                    <option value="custom">Tùy chọn ngày...</option>
                </select>

                <div id="customDateRange" style="display: none; gap: 5px; align-items: center;">
                    <input type="date" id="startDate"
                           style="padding: 4px; border: 1px solid #ccc; border-radius: 4px;">
                    <span>-</span>
                    <input type="date" id="endDate"
                           style="padding: 4px; border: 1px solid #ccc; border-radius: 4px;">
                    <button id="applyFilterBtn"
                            style="padding: 5px 15px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer;">Lọc</button>
                </div>
            </div>
        </div>

        <div style="height: 300px; width: 100%;">
            <canvas id="trendChart"></canvas>
        </div>
    </div>
    <div class="dashboard-content">
        <div class="chart-container">
            <h3>Tỷ lệ trạng thái tủ</h3>
            <div class="chart-box">
                <canvas id="chart"></canvas>
            </div>
        </div>

        <div class="chart-container">
            <h3>Số lượng tủ theo trạng thái</h3>
            <div class="chart-box">
                <canvas id="barChart"></canvas>
            </div>
        </div>
    </div>
</div>


    <script src="script.js"></script>
</body>

</html>
